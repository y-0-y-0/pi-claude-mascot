name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck extension and tests
        run: npm run typecheck

      - name: Validate package contents
        run: npm run pack:check

      - name: Smoke test packed artifact
        run: npm run pack:smoke

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --omit=peer --audit-level=moderate
